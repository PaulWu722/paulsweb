<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我的回訪</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <h1>我的回訪</h1>
  <div class="stats" id="stats"></div>
  <div class="top-actions">
    <button id="btnExport" class="ghost" title="匯出名單（JSON）">匯出</button>
    <label class="ghost btn-like" title="匯入名單（JSON）">匯入<input type="file" id="fileImport" accept="application/json" hidden /></label>
    <button id="btnAdd" class="primary">＋ 新增名單</button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <input id="search" type="search" placeholder="搜尋姓名、公司、備註…" />
    <div class="filters" id="filters">
      <button data-f="all" class="chip active">全部</button>
      <button data-f="overdue" class="chip">該回訪了</button>
      <button data-f="待回訪" class="chip">待回訪</button>
      <button data-f="已回訪" class="chip">已回訪</button>
      <button data-f="成交" class="chip">成交</button>
      <button data-f="暫緩" class="chip">暫緩</button>
    </div>
    <ul id="list" class="list"></ul>
  </aside>

  <section class="stage">
    <canvas id="scene"></canvas>
    <div id="labels" class="labels"></div>
    <div class="hint">點小人看資料・拖曳旋轉・滾輪縮放</div>

    <div id="detail" class="detail hidden">
      <button class="close" id="detailClose" aria-label="關閉">×</button>
      <div id="detailBody"></div>
      <div class="detail-actions">
        <button id="btnVisited" class="primary">今天已回訪 ✓</button>
        <button id="btnEdit">編輯</button>
        <button id="btnDelete" class="danger">刪除</button>
      </div>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">新增名單</h2>
    <label>姓名 *<input name="name" required /></label>
    <label>公司／身分<input name="company" /></label>
    <label>電話 / LINE<input name="phone" /></label>
    <div class="row">
      <label>狀態
        <select name="status">
          <option>待回訪</option><option>已回訪</option><option>成交</option><option>暫緩</option>
        </select>
      </label>
      <label>小人衣服顏色<input type="color" name="color" value="#4f8cff" /></label>
    </div>
    <div class="row">
      <label>上次聯絡<input type="date" name="lastContact" /></label>
      <label>下次回訪<input type="date" name="nextFollowUp" /></label>
    </div>
    <label>備註<textarea name="note" rows="3"></textarea></label>
    <div class="dlg-actions">
      <button type="button" id="dlgCancel">取消</button>
      <button type="submit" class="primary">儲存</button>
    </div>
  </form>
</dialog>

<script src="vendor/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
