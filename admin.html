<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌次管理｜年終愛筵</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
  <div class="demo-banner" id="demo-banner" hidden>示範模式：密碼 1234，資料只存在這台裝置的瀏覽器。</div>

  <header class="site-header">
    <nav class="nav container wide">
      <a href="index.html" class="logo"><span class="logo-mark">🕯️</span>年終愛筵<span class="logo-sub">同工後台</span></a>
      <ul class="nav-links">
        <li><a href="index.html">報名頁</a></li>
        <li><a href="#" id="logout" hidden>登出</a></li>
      </ul>
    </nav>
  </header>

  <!-- 密碼 -->
  <main class="gate" id="gate">
    <form class="card gate-card" id="gate-form">
      <div class="gate-icon">🔒</div>
      <h1>桌次管理</h1>
      <p class="muted">此頁面僅供同工使用，請輸入密碼。</p>
      <input type="password" name="pass" inputmode="numeric" autocomplete="current-password" placeholder="密碼" required autofocus>
      <p class="form-error" id="gate-error" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block">進入</button>
    </form>
  </main>

  <!-- 管理畫面 -->
  <main class="board container wide" id="board" hidden>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab is-active" role="tab" data-view="seats">🪑 桌次安排</button>
      <button type="button" class="tab" role="tab" data-view="people">📋 報名資料</button>
    </nav>

    <section id="view-seats">
    <div class="board-head">
      <div>
        <h1>桌次名單</h1>
        <p class="muted">拖曳名字即可換桌；拖到「尚未安排」即移出座位。每桌上限 <strong id="cap">10</strong> 人（含桌長）。</p>
      </div>
      <div class="board-actions">
        <button type="button" class="btn btn-small btn-ghost" id="refresh">↻ 重新整理</button>
        <button type="button" class="btn btn-small btn-primary" id="copy-text">複製名單文字</button>
      </div>
    </div>

    <ul class="stats" id="stats"></ul>

    <section class="unseated card" id="unseated-box">
      <div class="unseated-head">
        <h2>☆ 尚未安排桌次 <span class="count" id="unseated-count">0</span></h2>
      </div>
      <ul class="chip-list drop-zone" id="unseated" data-table="0"></ul>
    </section>

    <div class="table-boards" id="tables"></div>
    </section>

    <!-- 報名資料 -->
    <section id="view-people" hidden>
      <div class="board-head">
        <div>
          <h1>報名資料</h1>
          <p class="muted">所有人的性別、身分、小區與桌次。點欄位標題可以排序。</p>
        </div>
        <div class="board-actions">
          <button type="button" class="btn btn-small btn-ghost" id="people-refresh">↻ 重新整理</button>
          <button type="button" class="btn btn-small btn-primary" id="people-csv">下載 Excel（CSV）</button>
        </div>
      </div>

      <ul class="stats stats-sm" id="people-stats"></ul>

      <div class="filters card">
        <input type="search" id="f-q" placeholder="搜尋姓名、備註、修改碼⋯⋯">
        <select id="f-gender" aria-label="性別">
          <option value="">性別：全部</option><option>男</option><option>女</option><option value="-">未填</option>
        </select>
        <select id="f-role" aria-label="身分">
          <option value="">身分：全部</option><option>聖徒</option><option>福音朋友</option><option>學生</option><option value="-">未填</option>
        </select>
        <select id="f-area" aria-label="小區">
          <option value="">小區：全部</option><option>霧峰</option><option>朝陽</option><option>其他</option><option value="-">未填</option>
        </select>
        <select id="f-seat" aria-label="桌次">
          <option value="">桌次：全部</option><option value="seated">已入座</option><option value="unseated">尚未安排</option>
        </select>
        <span class="muted" id="f-count"></span>
      </div>

      <div class="people-wrap card">
        <table class="people-table">
          <thead>
            <tr>
              <th data-sort="idx">#</th>
              <th data-sort="name">姓名</th>
              <th data-sort="gender">性別</th>
              <th data-sort="role">身分</th>
              <th data-sort="area">小區</th>
              <th data-sort="table">桌次</th>
              <th data-sort="source">來源</th>
              <th data-sort="created">報名時間</th>
              <th data-sort="code">修改碼</th>
              <th data-sort="note">備註</th>
            </tr>
          </thead>
          <tbody id="people-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
